<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Officeキー道場</title>
<meta name="description" content="Excel・Word・PowerPoint・Windowsのショートカットと用語を、ゲーム感覚で覚える学習クイズ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home">
<a class="skip-link" href="#view">本文へ移動</a>
<header class="app-header">
  <div class="app-header-inner">
    <button class="brand nav-btn" data-nav="home" type="button" aria-label="Officeキー道場 トップへ">
      <span class="brand-mark" aria-hidden="true"><kbd>K</kbd></span>
      <span class="brand-name">Officeキー道場</span>
    </button>
    <nav class="app-nav" aria-label="メインメニュー">
      <button class="nav-btn" data-nav="home" type="button"><span class="nav-ico" aria-hidden="true">⌂</span>ホーム</button>
      <button class="nav-btn" data-nav="list" type="button"><span class="nav-ico" aria-hidden="true">☰</span>問題一覧</button>
      <button class="nav-btn" data-nav="records" type="button"><span class="nav-ico" aria-hidden="true">♛</span>記録</button>
    </nav>
  </div>
</header>

<main id="view" class="view" tabindex="-1">
  <noscript><p class="fatal">このサイトを使うには JavaScript を有効にしてください。</p></noscript>
</main>

<div id="overlay" class="overlay" hidden></div>
<div id="fx" class="fx" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="assertive"></div>

<!-- 問題データ → 保存 → キー判定 → ゲームルール → 画面 の順に読み込む -->
<script src="data/questions.js"></script>
<script src="js/storage.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
